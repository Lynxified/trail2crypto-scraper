name: Scrape Trail2Crypto
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Decode auth cookies
        run: echo "$X_STATE" | base64 -d > state.json
        env:
          X_STATE: ${{ secrets.X_STATE }}
      - name: Run scraper every 15 min (24 iterations)
        run: |
          for i in $(seq 1 24); do
            echo "=== Run $i of 24 ==="
            node zix-scraper.js
            if [ $i -lt 24 ]; then
              echo "Sleeping 15 minutes until next run..."
              sleep 900
            fi
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
